# .github/workflows/bot29b.yml — jumeaux du carry neutre (29b et 29c)
#
# Trois bots qui isolent DEUX variables, et rien d'autre :
#     29  ...  6 jambes, panier unique, tenue 168 h   (existant)
#     29b ... 20 jambes, panier unique, tenue 168 h   -> effet du NOMBRE DE JAMBES
#     29c ... 20 jambes, paniers DECALES toutes les 48 h, tenue 168 h
#                                                     -> effet du DECALAGE
# Meme signal, meme tenue, meme comptabilite, meme gate, meme journal.
#
# FONDEMENT CHIFFRE (05/08). Sur les 38 anciens trades du bot 28 recalcules
# proprement : funding +0,2752 %/trade a t = +2,53 (REEL), prix -1,3621 % a
# t = -0,52 (moyenne nulle) mais ecart-type 16,15 %. Le probleme est la
# VARIANCE, pas la moyenne : inutile de mieux predire, il faut moins de bruit.
#   - 6 -> 20 jambes : bruit du panier / racine(20/6) = x1,83 sur le t,
#     sans reduire le nombre de paniers. Verdict divise par 3,3.
#   - raccourcir la tenue : ECARTE. Les frais sont fixes (0,09 % l'aller-retour),
#     donc 48 h coute 3,5 mois de verdict pour gagner 5 jours de 1re donnee.
#     Le decalage donne le meme confort de suivi sans ce cout.
#
# Cadence 30 min : le funding s'accumule a chaque passe, les clotures se font
# a 168 h. Aucune cle, aucun ordre reel.
name: bot-29bc
on:
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot29bc
  cancel-in-progress: false

jobs:
  bot29bc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Passe des jumeaux 29b et 29c
        run: python run_29bc.py
      - name: Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien a committer."
          else
            git commit -m "29bc $(date -u +%FT%Hh%MZ)"
            git pull --rebase --autostash || true
            git push || (git pull --rebase --autostash && git push)
          fi
