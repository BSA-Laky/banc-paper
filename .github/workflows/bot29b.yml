# .github/workflows/bot29b.yml — carry neutre LARGE (20 jambes)
#
# A/B contre le bot 29 (6 jambes) : meme signal, meme tenue de 168 h, seul le
# nombre de jambes change. Fondement chiffre (05/08) : sur les 38 anciens trades
# du bot 28 recalcules proprement, le funding est REEL (t = +2,53) mais l'ecart-
# type du prix atteint 16,15 % contre un signal net de 0,185 %. Le probleme est
# la variance, pas la moyenne. Passer de 6 a 20 jambes divise le bruit du panier
# par racine(20/6) = 1,83, sans reduire le nombre de paniers -- donc sans perdre
# d'observations independantes. Temps de verdict divise par 3,3.
#
# Meme cadence que la station (15 min) : le bot ne solde qu'a 168 h, les autres
# passes ne font qu'accumuler le funding. Aucune cle, aucun ordre reel.
name: bot-29b
on:
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot29b
  cancel-in-progress: false

jobs:
  bot29b:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Passe du carry neutre large
        run: python run_29b.py
      - name: Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien a committer."
          else
            git commit -m "29b $(date -u +%FT%Hh%MZ)"
            git pull --rebase --autostash || true
            git push || (git pull --rebase --autostash && git push)
          fi
