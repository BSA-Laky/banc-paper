# .github/workflows/collecte.yml — horloge lente : OI + carnet L2
#
# Enregistre en avant ce que l'API Hyperliquid ne fournit PAS en historique
# (verifie le 02/08/2026 : openInterestHistory et liquidations renvoient 422,
# l2Book n'a pas d'historique). Sans cette collecte, deux hypotheses ne sont
# pas testables du tout : le modele « Carry Provider » complet (qui a besoin de
# l'open interest comme variable d'encombrement) et la piste « retrait des
# teneurs de marche » (qui a besoin de la profondeur du carnet).
#
# Cadence horaire : suffisante pour le funding (horaire par nature) et pour
# detecter un retrait de liquidite (qui dure des heures, pas des secondes).
# Un pas plus fin gonflerait le depot sans rien ajouter au test.
#
# PREMIER TEST EXPLOITABLE : 60 jours distincts (30 train + 30 test), l'unite
# independante etant la DATE et non le point de mesure. Soit ~8-9 semaines.
# docs/ n'est pas touche : ce workflow n'affiche rien, il archive.
name: collecte-microstructure
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instantane OI + carnet
        run: python collecteur_microstructure.py
      - name: Archiver
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A donnees
          if git diff --cached --quiet; then
            echo "Rien a archiver."
          else
            git commit -m "collecte $(date -u +%FT%HZ)"
            git pull --rebase --autostash || true
            git push || (git pull --rebase --autostash && git push)
          fi
